<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Support – ShipXpress</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f1f4f8;
        }

        .support-container {
            max-width: 900px;
            margin: 50px auto;
            padding: 40px;
            background: white;
            border-radius: 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.05);
        }

        h1 {
            text-align: center;
            color: #0074d9;
            margin-bottom: 30px;
        }

        .support-form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        label {
            font-weight: 600;
        }

        input,
        textarea,
        select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            background-color: #0074d9;
            color: white;
            padding: 12px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background-color: #005fa3;
        }

        .support-info {
            margin-top: 40px;
        }

        .support-info h3 {
            margin-bottom: 10px;
        }

        .support-info p {
            margin: 5px 0;
        }

        .faq-link {
            display: inline-block;
            margin-top: 20px;
            color: #0074d9;
            text-decoration: none;
        }

        .faq-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="support-container">
        <h1>Customer Support</h1>

    <form action="support.php" method="POST" enctype="multipart/form-data" class="support-form">
        <label for="name">Full Name</label>
        <input type="text" name="name" required />
    
        <label for="email">Email Address</label>
        <input type="email" name="email" required />
    
        <label for="subject">Issue Category</label>
        <select name="subject" required>
            <option value="">-- Select an Issue --</option>
            <option value="tracking">Tracking Problem</option>
            <option value="billing">Billing Issue</option>
            <option value="delayed">Delayed Shipment</option>
            <option value="account">Account Support</option>
            <option value="other">Other</option>
        </select>
    
        <label for="message">Describe Your Issue</label>
        <textarea name="message" rows="5" required></textarea>
    
        <!-- 📎 NEW FIELD: File upload -->
        <label for="attachment">Upload Screenshot (optional)</label>
        <input type="file" name="attachment" accept=".jpg,.jpeg,.png,.pdf" />
    
        <button type="submit">Submit Request</button>
    </form>
        <p>We aim to respond to all inquiries within 24 hours.</p>
        <p>If you need immediate assistance, please contact us directly.</p>

        <div class="support-info">
            <h3>Need Immediate Help?</h3>
            <p><strong>Email:</strong> support@shipxpress.com</p>
            <p><strong>Phone:</strong> +1 800 123 4567</p>
            <p><strong>Hours:</strong> Mon–Fri, 9:00 AM – 6:00 PM</p>

            <a href="faq.html" class="faq-link">→ Visit our FAQ page</a>
        </div>
    </div>
</body>

</html>
